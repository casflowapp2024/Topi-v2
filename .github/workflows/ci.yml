# CI de Topi: API (Go) + worker (Python) contra un Postgres de servicio, y build del web.
# Sin Playwright ni el dump: el Postgres arranca con apps/api/testdata/schema_v17.sql (esquema de
# producción en la versión 17, sin datos de usuarios) y la API migra 18 → 26, como en producción.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: api + worker
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topi
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topi -d cashflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # solo para este Postgres efímero del CI
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: topi
      DB_PASSWORD: ci
      DB_NAME: cashflow_test
      TEST_DATABASE_URL: postgresql://topi:ci@localhost:5432/cashflow_test
    steps:
      - uses: actions/checkout@v4

      - name: Esquema v17 (sin datos)
        # psql del propio contenedor del servicio: no depende de lo que traiga el runner
        run: docker exec -i ${{ job.services.postgres.id }} psql -U topi -d cashflow_test -q -v ON_ERROR_STOP=1 < apps/api/testdata/schema_v17.sql

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: go vet
        working-directory: apps/api
        run: go vet ./...

      - name: go test (unitarios)
        working-directory: apps/api
        run: go test ./...

      - name: go test (integración; migra la base de 17 a 26)
        working-directory: apps/api
        run: go test -tags integration -count=1 ./internal/adapter/storage/postgres/repository/

      - name: Migraciones en la versión 26
        run: |
          v="$(docker exec ${{ job.services.postgres.id }} psql -U topi -d cashflow_test -At -c 'SELECT version FROM schema_migrations WHERE NOT dirty')"
          echo "schema_migrations.version = $v"
          test "$v" -ge 26

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/requirements*.txt

      - name: pytest (worker, incluidos los tests con base)
        working-directory: apps/worker
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

  web:
    name: web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        working-directory: apps/web
        # @testing-library/react@13 declara peer react@18 y la app usa react@19 (igual que el Dockerfile)
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: npm run build
        working-directory: apps/web
        env:
          # CRA trata las advertencias de ESLint como errores con CI=true; el código tiene
          # advertencias previas a la migración. Los errores de compilación siguen fallando.
          CI: "false"
          REACT_APP_API_URL: https://api.topi.cash
        run: npm run build
