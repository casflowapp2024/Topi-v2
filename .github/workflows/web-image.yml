# Imagen del front (apps/web) compilada en GitHub Actions y publicada en GHCR: el servidor (4 GB)
# no compila React; Coolify solo descarga ghcr.io/<owner>/topi-web. Ver infra/coolify/RUNBOOK.md,
# sección "Front desde GHCR".
name: web-image

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web-image.yml
  workflow_dispatch:

# Un solo build por rama a la vez; sin cancelar: un build a medio publicar dejaría tags a medias.
concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build + push
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar variables del repo
        env:
          WEB_API_URL: ${{ vars.WEB_API_URL }}
        run: |
          if [ -z "$WEB_API_URL" ]; then
            echo "::error title=Falta WEB_API_URL::Define la variable del repo WEB_API_URL (Settings → Secrets and variables → Actions → Variables), p. ej. https://api.topi.cash"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Nombre de imagen y SHA corto
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/topi-web" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          # vincula el paquete al repo: hereda su visibilidad y permisos
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # sin attestations: suben manifiestos sin tag que ocupan versiones en GHCR
          provenance: false
          sbom: false
          cache-from: type=gha,scope=topi-web
          cache-to: type=gha,mode=max,scope=topi-web
          build-args: |
            REACT_APP_API_URL=${{ vars.WEB_API_URL }}
            REACT_APP_GA_TRACKING_ID=${{ vars.WEB_GA_TRACKING_ID }}
            BUILD_ID=${{ steps.vars.outputs.short_sha }}

  cleanup:
    name: limpiar GHCR (últimas 10)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # latest siempre es la versión más nueva (queda dentro de las 10); ignore-versions es por si acaso
      - uses: actions/delete-package-versions@v5
        with:
          package-name: topi-web
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^latest$'

  # DESHABILITADO hasta que Coolify tenga HTTPS (el token viajaría en claro).
  # Para activarlo: secrets COOLIFY_URL (https://..., sin barra final), COOLIFY_WEB_UUID y COOLIFY_TOKEN,
  # y quitar el `if: false`.
  deploy:
    name: deploy en Coolify
    needs: build
    if: false
    runs-on: ubuntu-24.04
    steps:
      - name: Disparar deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_WEB_UUID"
