host: localhost:8080
info:
  contact:
    email: support@yourdomain.com
    name: API Support
    url: http://yourdomain.com/support
  description: API for managing cash flow operations.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://yourdomain.com/terms/
  title: Cash Flow API
  version: "1.0"
paths:
  /account-types/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a specific account type by ID
      parameters:
      - description: Account Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Account type details
          schema:
            allOf:
            - $ref: '#/definitions/http.response'
            - properties:
                data:
                  $ref: '#/definitions/http.accountTypeResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Unauthorized error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Get account type
      tags:
      - Account Types
  /account-types/admin/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an account type by ID (Admin only)
      parameters:
      - description: Account Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Account type deleted
          schema:
            $ref: '#/definitions/http.response'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Unauthorized error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Delete account type
      tags:
      - Account Types
    put:
      consumes:
      - application/json
      description: Updates an existing account type (Admin only)
      parameters:
      - description: Account Type ID
        in: path
        name: id
        required: true
        type: integer
      - description: Account type update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.updateAccountTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account type updated
          schema:
            allOf:
            - $ref: '#/definitions/http.response'
            - properties:
                data:
                  $ref: '#/definitions/http.accountTypeResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Unauthorized error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Update account type
      tags:
      - Account Types
  /account-types/admin/create:
    post:
      consumes:
      - application/json
      description: Creates a new account type (Admin only)
      parameters:
      - description: Account type creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.createAccountTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account type created
          schema:
            allOf:
            - $ref: '#/definitions/http.response'
            - properties:
                data:
                  $ref: '#/definitions/http.accountTypeResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Unauthorized error
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Create account type
      tags:
      - Account Types
