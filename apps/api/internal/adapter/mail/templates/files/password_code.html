{{define "content"}}
<p style="margin:0 0 16px 0;font-size:18px;font-weight:700;color:#111827;">Tu código para cambiar la contraseña</p>
<p style="margin:0 0 20px 0;color:#374151;">Escríbelo en la pantalla donde lo pediste:</p>
<p style="margin:0 0 20px 0;text-align:center;">
  <span style="display:inline-block;padding:14px 22px;background:#eef0fd;border-radius:12px;font-size:30px;font-weight:800;letter-spacing:8px;color:#5266EB;font-family:'SFMono-Regular',Consolas,monospace;">{{.code}}</span>
</p>
<p style="margin:0 0 8px 0;color:#374151;">Vence en {{.minutes}} minutos.</p>
<p style="margin:0;color:#6b7280;font-size:13px;">Si no fuiste tú, ignora este correo: tu contraseña no cambia.</p>
{{end}}
