{{define "content"}}
<p style="margin:0 0 16px 0;font-size:18px;font-weight:700;color:#111827;">{{.heading}}</p>
<p style="margin:0 0 20px 0;color:#374151;">{{.intro}}</p>
{{if .details}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;border-top:1px solid #e5e7eb;">
  {{range .details}}
  <tr>
    <td style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;font-size:14px;">{{.label}}</td>
    <td style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#111827;font-size:14px;font-weight:600;text-align:right;">{{.value}}</td>
  </tr>
  {{end}}
</table>
{{end}}
{{if .cta_url}}
<p style="margin:0 0 20px 0;">
  <a href="{{.cta_url}}" style="display:inline-block;padding:12px 20px;background:#5266EB;color:#ffffff;border-radius:10px;font-weight:600;text-decoration:none;">{{.cta_label}}</a>
</p>
{{end}}
{{if .note}}<p style="margin:0;color:#6b7280;font-size:13px;">{{.note}}</p>{{end}}
{{end}}
