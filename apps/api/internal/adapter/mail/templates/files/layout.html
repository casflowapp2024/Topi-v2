<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 16px 4px;font-size:22px;font-weight:800;color:#5266EB;letter-spacing:-0.5px;">Topi</td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:32px 28px;font-size:15px;line-height:1.6;">
{{template "content" .}}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 4px;font-size:12px;line-height:1.5;color:#6b7280;">
            Recibes este correo porque tienes una cuenta en Topi.
            {{if .unsubscribe_url}}<br><a href="{{.unsubscribe_url}}" style="color:#6b7280;text-decoration:underline;">Dejar de recibir estos correos</a>{{end}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
