# SPA de Topi. Headers de seguridad en cada location que define add_header (nginx no los hereda).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    set $permissions "camera=(), microphone=(), geolocation=(), payment=(), usb=()";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Bundles con hash: caché larga. Sin fallback a index.html: un bundle viejo que ya no existe
    # debe dar 404, no HTML (que el navegador intentaría ejecutar como JS).
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $permissions always;
    }

    # Siempre revalidar: así los usuarios reciben el SW y el index.html del último deploy.
    location ~ ^/(index\.html|service-worker\.js|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $permissions always;
    }

    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $permissions always;
    }
}
