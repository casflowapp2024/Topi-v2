# Entorno local: Postgres 16 (restaurado desde el dump) + API + worker + web.
# Variables: infra/.env (copia de infra/.env.example). Ver README raíz.
name: topi

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cashflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # dump de producción (solo lectura) para infra/scripts/restore.sh
      - ${DUMP_FILE:-../../cashflowprod.dump}:/dump/cashflowprod.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../apps/api
    env_file:
      # opcional: Gmail/Outlook/Cognito para la API (copia de apps/api/.env.example)
      - path: ../apps/api/.env
        required: false
    environment:
      APP_NAME: topi-api
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_URL: 0.0.0.0
      HTTP_PORT: "8080"
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-topi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/.env}
      DB_NAME: ${POSTGRES_DB:-cashflow}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en infra/.env (openssl rand -hex 32)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      INITIAL_PASSWORD_UNTIL: ${INITIAL_PASSWORD_UNTIL:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-1h}
      HTTP_ALLOWED_HEADERS: Origin,Content-Type,Accept,Authorization
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    # Lector de correos (Fase 3). Por defecto en local NO procesa correos reales:
    # WORKER_DRY_RUN=true y WORKER_ONLY_EMAIL_IDS=0 (ninguna conexión). Para probar con la conexión
    # del equipo, defínelos en infra/.env (ver README).
    build:
      context: ../apps/worker
      target: final
    env_file:
      # opcional: GEMINI_API_KEY y OAuth de Gmail/Outlook (copia de apps/worker/.env.example)
      - path: ../apps/worker/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-topi}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/.env}@postgres:5432/${POSTGRES_DB:-cashflow}
      API_BASE_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?define INTERNAL_API_KEY en infra/.env}
      WORKER_DRY_RUN: ${WORKER_DRY_RUN:-true}
      WORKER_ONLY_EMAIL_IDS: ${WORKER_ONLY_EMAIL_IDS:-0}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Front (nginx). REACT_APP_* se hornean en el build: cambiarlas exige `docker compose build web`.
    build:
      context: ../apps/web
      args:
        REACT_APP_API_URL: ${WEB_API_URL:-http://localhost:8080}
        REACT_APP_GA_TRACKING_ID: ""
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
